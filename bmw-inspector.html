<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMW GLB Inspector</title><style>
body{margin:0;font:14px system-ui;background:#111;color:#eee}header{padding:14px;background:#1b1b1b;position:sticky;top:0;z-index:2}h1{font-size:18px;margin:0 0 8px}.status{color:#aaa}.wrap{display:grid;grid-template-columns:minmax(280px,42%) 1fr;min-height:calc(100vh - 80px)}#tree{padding:12px;overflow:auto;border-right:1px solid #333}.node{padding:5px 6px;margin:1px 0;cursor:pointer;border-radius:4px}.node:hover,.node.sel{background:#303030}.tag{color:#8fc7ff;margin-left:6px;font-size:11px}.found{outline:1px solid #f0c44c}.info{padding:14px;overflow:auto}.kv{display:grid;grid-template-columns:140px 1fr;gap:6px;margin:4px 0}.box{border:1px solid #333;border-radius:8px;padding:10px;margin:10px 0}.warn{color:#ffd66b}.good{color:#8ff0a4}button{padding:8px 12px;border:0;border-radius:6px}input{background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:8px;width:70%}@media(max-width:700px){.wrap{grid-template-columns:1fr}.info{border-top:1px solid #333}.kv{grid-template-columns:110px 1fr}}</style></head><body>
<header><h1>BMW GLB Inspector — car-model.glb</h1><input id="search" placeholder="Поиск: Disk_L, Disk_R, wheel, tire..."> <button id="reload">Перезагрузить</button><div id="status" class="status">Загрузка BMW...</div></header>
<div class="wrap"><div id="tree"></div><div class="info" id="info"><div class="box">Выбери узел.</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const MODEL='car-model.glb';let all=[],selected=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function collect(n,parent=null,depth=0){const item={n,parent,depth};all.push(item);n.userData.__parent=parent;n.children.forEach(c=>collect(c,item,depth+1))}
function renderTree(){const q=$('search').value.toLowerCase().trim();$('tree').innerHTML=all.map((x,i)=>{const hit=!q||(x.n.name||'').toLowerCase().includes(q);if(!hit)return '';const type=x.n.isMesh?'MESH':x.n.type;return '<div class="node '+(/disk_l|disk_r/i.test(x.n.name||'')?'found ':'')+'" data-i="'+i+'" style="padding-left:'+(6+x.depth*16)+'px">'+(x.n.children.length?'▸ ':'　 ')+esc(x.n.name||'(без имени)')+' <span class="tag">'+type+'</span></div>'}).join('');document.querySelectorAll('.node').forEach(e=>e.onclick=()=>select(+e.dataset.i))}
function vec(v){return v?'x='+v.x.toFixed(4)+', y='+v.y.toFixed(4)+', z='+v.z.toFixed(4):'—'}
function select(i){selected=all[i];document.querySelectorAll('.node').forEach(e=>e.classList.remove('sel'));const el=document.querySelector('[data-i="'+i+'"]');if(el)el.classList.add('sel');const n=selected.n,p=selected.parent;const siblings=p?p.n.children.map(c=>c.name||'(без имени)').join(', '):'—';const children=n.children.map(c=>c.name||'(без имени)').join(', ')||'—';let b='<h2>'+esc(n.name||'(без имени)')+'</h2><div class="box"><div class="kv"><b>Тип</b><span>'+(n.isMesh?'Mesh':n.type)+'</span></div><div class="kv"><b>Parent</b><span>'+esc(p?p.n.name:'(Scene)')+'</span></div><div class="kv"><b>Дети</b><span>'+esc(children)+'</span></div><div class="kv"><b>Соседи</b><span>'+esc(siblings)+'</span></div><div class="kv"><b>Position</b><span>'+vec(n.position)+'</span></div><div class="kv"><b>Rotation</b><span>'+vec(n.rotation)+'</span></div><div class="kv"><b>Scale</b><span>'+vec(n.scale)+'</span></div></div>';if(/disk_l|disk_r/i.test(n.name||''))b+='<div class="box good"><b>★ Нужный диск.</b><br>Здесь видны Parent, дети и соседи для точной привязки.</div>';$('info').innerHTML=b}
function load(){$('status').textContent='Загружаю BMW...';all=[];new THREE.GLTFLoader().load(MODEL,g=>{collect(g.scene);const dl=all.filter(x=>/^disk_l$/i.test(x.n.name||'')),dr=all.filter(x=>/^disk_r$/i.test(x.n.name||'')),w=all.filter(x=>/wheel|tire|tyre|rim|hub|disc/i.test(x.n.name||''));$('status').innerHTML='<span class="good">BMW загружена.</span> Узлов: '+all.length+' · Mesh: '+all.filter(x=>x.n.isMesh).length+' · Disk_L: '+dl.length+' · Disk_R: '+dr.length+' · wheel/tire/rim/hub: '+w.length;renderTree();if(dl[0])select(all.indexOf(dl[0]));else if(dr[0])select(all.indexOf(dr[0]))},x=>{if(x.total)$('status').textContent='Загрузка BMW: '+Math.round(x.loaded/x.total*100)+'%'},e=>$('status').innerHTML='<span class="warn">Ошибка загрузки: '+esc(e.message||e)+'</span>')}
$('search').oninput=renderTree;$('reload').onclick=load;load();
</script></body></html>
