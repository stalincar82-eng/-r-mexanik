name: Upgrade garage system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade garage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game.js')
          s = p.read_text()

          # Add the richer workshop props once.
          if '  buildGarageEquipment();' not in s:
              marker = '  buildGarageLocation();\n'
              if marker not in s:
                  raise SystemExit('garage location call not found')
              s = s.replace(marker, marker + '  buildGarageEquipment();\n', 1)

          equipment = r'''
  function buildGarageEquipment() {
    var gx = 30;
    var gz = 0;
    var steel = material(0x59615d, 0.72, 0.38);
    var dark = material(0x242a28, 0.8, 0.25);
    var yellow = material(0xd9f36a, 0.48, 0.05);
    var red = material(0xb64a3f, 0.62, 0.18);
    var wood = material(0x6b5540, 0.78, 0.05);
    var posts = [[-3.7,-2.9],[-3.7,2.9],[3.7,-2.9],[3.7,2.9]];
    var i;
    for (i = 0; i < posts.length; i++) {
      box(scene, 0.22, 3.9, 0.22, 0x59615d, gx + posts[i][0], 1.95, gz + posts[i][1], steel);
      box(scene, 0.62, 0.12, 0.38, 0xd9f36a, gx + posts[i][0], 3.82, gz + posts[i][1], yellow);
    }
    box(scene, 7.6, 0.12, 0.42, 0x59615d, gx, 0.18, gz - 2.55, steel);
    box(scene, 7.6, 0.12, 0.42, 0x59615d, gx, 0.18, gz + 2.55, steel);
    box(scene, 4.6, 0.16, 0.72, 0x6b5540, gx - 5.7, 1.35, gz + 5.55, wood);
    box(scene, 0.16, 1.35, 0.16, 0x59615d, gx - 7.55, 0.68, gz + 5.25, steel);
    box(scene, 0.16, 1.35, 0.16, 0x59615d, gx - 3.85, 0.68, gz + 5.25, steel);
    box(scene, 1.55, 2.8, 0.7, 0x424946, gx + 6.4, 1.4, gz + 5.65, dark);
    for (i = 0; i < 3; i++) box(scene, 1.15, 0.08, 0.05, 0xd9f36a, gx + 6.4, 0.65 + i * 0.7, gz + 5.25, yellow);
    box(scene, 1.1, 0.14, 0.62, 0xb64a3f, gx - 6.3, 0.28, gz - 5.45, red);
    box(scene, 0.12, 0.95, 0.12, 0xb64a3f, gx - 6.3, 0.78, gz - 5.45, red);
    box(scene, 1.25, 0.12, 0.7, 0x59615d, gx + 5.2, 0.9, gz - 5.35, steel);
    box(scene, 0.12, 1.65, 0.12, 0x59615d, gx + 4.65, 0.45, gz - 5.35, steel);
    box(scene, 0.12, 1.65, 0.12, 0x59615d, gx + 5.75, 0.45, gz - 5.35, steel);
    box(scene, 0.18, 0.03, 5.8, 0xd9f36a, gx - 2.0, 0.11, gz, yellow);
    box(scene, 0.18, 0.03, 5.8, 0xd9f36a, gx + 2.0, 0.11, gz, yellow);
    for (i = -1; i <= 1; i++) {
      var lamp = box(scene, 2.8, 0.08, 0.28, 0xe8f0d4, gx + i * 5.0, 4.82, gz - 0.5, material(0xe8f0d4, 0.32, 0));
      lamp.material.emissive = new THREE.Color(0x6f7e58);
    }
    for (i = 0; i < 4; i++) {
      var tire = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.16, 10, 20), dark);
      tire.rotation.y = Math.PI / 2;
      tire.position.set(gx - 7.5 + i * 0.78, 0.72, gz + 3.95);
      tire.castShadow = true;
      scene.add(tire);
    }
  }
'''
          if 'function buildGarageEquipment()' not in s:
              anchor = '  function buildCar() {\n'
              if anchor not in s:
                  raise SystemExit('buildCar anchor not found')
              s = s.replace(anchor, equipment + '\n' + anchor, 1)

          # Save/restore installed/removed and open/closed states per car.
          state = r'''
  function garageStateKey() {
    return 'motornaya-garage-state-' + selectedCar;
  }

  function saveGarageState() {
    try {
      var state = {};
      var ids = Object.keys(parts);
      for (var i = 0; i < ids.length; i++) {
        var id = ids[i];
        var part = parts[id];
        if (!part) continue;
        state[id] = { visible: part.visible !== false, isOpen: !!part.isOpen };
      }
      window.localStorage.setItem(garageStateKey(), JSON.stringify(state));
    } catch (error) {}
  }

  function restoreGarageState() {
    try {
      var raw = window.localStorage.getItem(garageStateKey());
      if (!raw) return;
      var state = JSON.parse(raw);
      if (!state) return;
      var ids = Object.keys(state);
      for (var i = 0; i < ids.length; i++) {
        var id = ids[i];
        var saved = state[id];
        var part = parts[id];
        if (!part || !saved) continue;
        part.visible = saved.visible !== false;
        if (part.object) part.object.visible = part.visible;
        part.isOpen = !!saved.isOpen && part.visible;
        part.targetAngle = part.isOpen ? part.angle : 0;
        if (part.recess) part.recess.visible = part.isOpen;
      }
    } catch (error) {}
  }
'''
          if 'function garageStateKey()' not in s:
              anchor = '  function discoverCarParts(model) {\n'
              if anchor not in s:
                  raise SystemExit('discoverCarParts anchor not found')
              s = s.replace(anchor, state + '\n' + anchor, 1)

          load_marker = '      discoverCarParts(model);\n      updatePartsPanel();'
          if '      restoreGarageState();' not in s:
              if load_marker not in s:
                  raise SystemExit('car parts load marker not found')
              s = s.replace(load_marker, '      discoverCarParts(model);\n      restoreGarageState();\n      updatePartsPanel();', 1)

          remove_old = "    updatePartsPanel();\n    showToast(object.label + (object.visible ? ' установлена' : ' снята'));"
          remove_new = "    updatePartsPanel();\n    saveGarageState();\n    showToast(object.label + (object.visible ? ' установлена' : ' снята'));"
          if remove_old in s and remove_new not in s:
              s = s.replace(remove_old, remove_new, 1)

          open_old = "    updatePartsPanel();\n    showToast(object.label + (object.isOpen ? ' открыта' : ' закрыта'));"
          open_new = "    updatePartsPanel();\n    saveGarageState();\n    showToast(object.label + (object.isOpen ? ' открыта' : ' закрыта'));"
          if open_old in s and open_new not in s:
              s = s.replace(open_old, open_new, 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade garage with equipment and saved car state"
            git push
          fi
