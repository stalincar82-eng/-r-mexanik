name: Fix garage camera

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep garage camera inside the workshop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game.js')
          s = p.read_text()
          old1 = "var offsetX = driving ? Math.sin(cameraHeading) * 5.2 : 7;"
          old2 = "var offsetZ = driving ? -Math.cos(cameraHeading) * 6.8 : 8;"
          s = s.replace(old1, "var offsetX = driving ? Math.sin(cameraHeading) * 5.2 : 3.8;")
          s = s.replace(old2, "var offsetZ = driving ? -Math.cos(cameraHeading) * 6.8 : 4.2;")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix garage camera framing"
            git push
          fi
