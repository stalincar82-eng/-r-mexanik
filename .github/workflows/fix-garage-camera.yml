name: Fix garage camera

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep garage camera inside the workshop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game.js')
          s = p.read_text()
          old = "car.position.set(30, 0, 0);"
          new = "car.position.set(30, 0, -2.5);"
          if old not in s:
              raise SystemExit('garage position line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "Keep garage camera inside workshop"
          git push
