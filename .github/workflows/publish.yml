name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch BMW wheel geometry before publishing
        shell: pwsh
        run: |
          $patch = ' '
          [IO.File]::WriteAllBytes('patch_wheels.py', [Convert]::FromBase64String($patch))
          python patch_wheels.py
          Remove-Item patch_wheels.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js
          git commit -m 'Fix BMW wheel geometry pivots' || Write-Host 'No wheel patch commit needed'
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:win
      - name: Publish Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Windows installer
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/Motornaya-Setup.exe
